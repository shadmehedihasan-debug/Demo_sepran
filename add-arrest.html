<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Add arrest record | DEMO UNIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#FFFFFF; --ink:#0B1F5E; --muted:#4A5272;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100svh; background:var(--bg); color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex; flex-direction:column;
}
header{
  background:var(--ink); color:#FFFFFF; text-align:center;
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + .6rem) .75rem .6rem;
}
h1,h2{font-family:"Bricolage Grotesque","Arial Black",Impact,sans-serif; font-weight:800; margin:0}
h1{font-size:clamp(1.3rem,3vw,1.9rem); letter-spacing:.04em}
.back{display:grid; place-items:center; width:44px; height:44px; justify-self:start; border:2px solid #FFFFFF; border-radius:6px; color:#FFFFFF; text-decoration:none}
.back:hover{background:rgba(255,255,255,.18)}
.back:focus-visible{outline:3px solid #FFFFFF; outline-offset:-3px}
.logout{justify-self:end; padding:.5rem .9rem; border:2px solid #FFFFFF; border-radius:6px; color:#FFFFFF; text-decoration:none; font-weight:600; font-size:.95rem}
.logout:hover{background:rgba(255,255,255,.18)}
.logout:focus-visible{outline:3px solid #FFFFFF; outline-offset:2px}
.layout{flex:1; display:grid; grid-template-columns:240px minmax(0,1fr); gap:2rem; align-items:start; width:min(100%,1000px); margin:0 auto; padding:2rem 1.25rem 2.5rem}
.menu{border:2px solid var(--ink); border-radius:8px; background:#EEF1FB; overflow:hidden}
.menu a{display:block; padding:1rem 1.1rem; color:var(--ink); text-decoration:none; border-top:1px solid #C9D0EA; border-left:6px solid transparent; font-family:"Bricolage Grotesque","Arial Black",Impact,sans-serif; font-weight:800}
.menu a:first-child{border-top:0}
.menu a:hover{background:#E2E7F8}
.menu a[aria-current="page"]{background:#FFFFFF; border-left-color:var(--ink)}
.menu a:focus-visible{outline:3px solid var(--ink); outline-offset:-3px}
@media (max-width:760px){.layout{grid-template-columns:1fr; gap:1.25rem}}
main{min-width:0; max-width:560px}
h2{font-size:clamp(1.5rem,4vw,2rem); margin-bottom:.4rem}
.sub{margin:0 0 1.5rem; color:var(--muted)}
.box{border:2px solid var(--ink); border-radius:8px; padding:1.75rem 1.5rem}
label{display:block; margin:0 0 .4rem; font-weight:600}
input,select,textarea{
  width:100%; padding:.8rem .9rem; margin:0 0 1.25rem;
  border:2px solid var(--ink); border-radius:4px; background:#FFFFFF; color:var(--ink);
  font:400 1rem "Figtree",system-ui,sans-serif;
}
textarea{min-height:7rem; resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
button{
  width:100%; padding:.9rem 1rem; border:0; border-radius:999px; cursor:pointer;
  background:var(--ink); color:#FFFFFF;
  font-family:"Bricolage Grotesque","Arial Black",Impact,sans-serif;
  font-weight:800; font-size:1.125rem; letter-spacing:.03em;
}
button:hover{filter:brightness(1.25)}
button:focus-visible{outline:3px solid var(--ink); outline-offset:4px}
.status{min-height:1.4em; margin:1rem 0 0; text-align:center}
.note{margin:1rem 0 0; font-size:.9rem; color:var(--muted)}
::placeholder{color:#7C839F; opacity:1}
</style>
</head>
<body>
<header>
  <a class="back" id="back" href="dashboard.html" aria-label="Back">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  </a>
  <h1>DEMO UNIT</h1>
  <a class="logout" href="login.html">Log out</a>
</header>
<div class="layout">
<nav class="menu" aria-label="Police menu">
  <a href="dashboard.html">Find a record</a>
  <a href="#" aria-current="page">Add arrest record</a>
  <a href="add-medical.html">Add medical checkup</a>
</nav>
<main>
  <h2>Add arrest record</h2>
  <p class="sub">Enter the details of the person who was arrested.</p>
  <div class="box">
    <form id="f" novalidate>
      <label for="name">Detainee name</label>
      <input id="name" name="name" type="text" autocomplete="off" placeholder="e.g. Abdul Karim">
      <label for="nid">NID number</label>
      <input id="nid" name="nid" type="text" autocomplete="off" placeholder="e.g. 1234567890123">
      <label for="station">Police station</label>
      <input id="station" name="station" type="text" autocomplete="off" placeholder="e.g. Gulshan Police Station">
      <label for="arrested">Date and time of arrest</label>
      <input id="arrested" name="arrested" type="datetime-local" autocomplete="off">
      <label for="status">Status</label>
      <select id="status" name="status"><option>Active</option><option>Logged on time</option><option>Remand</option><option>Released</option></select>
      <button type="submit">Save record</button>
      <p class="status" id="s" role="status" aria-live="polite"></p>
    </form>
  </div>
  <p class="note">The time you save this record is stamped by the system.</p>
</main>
</div>
<script>
function postJson(url,body){return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return {};}).then(function(d){return {ok:r.ok,status:r.status,d:d};});});}
var ids=["name","nid","station","arrested"];
document.getElementById("f").addEventListener("submit",function(e){
  e.preventDefault();
  var s=document.getElementById("s");
  for(var i=0;i<ids.length;i++){
    if(!document.getElementById(ids[i]).value.trim()){s.textContent="Fill in the detainee name, NID, station and arrest time."; return;}
  }
  var map={"Active":"Active","Logged on time":"Logged_On_Time","Remand":"Remand","Released":"Released"};
  s.textContent="Saving...";
  postJson("/api/arrests",{
    detainee_name:document.getElementById("name").value.trim(),
    nid:document.getElementById("nid").value.trim(),
    station:document.getElementById("station").value.trim(),
    arrested_at:new Date(document.getElementById("arrested").value).toISOString(),
    status:map[document.getElementById("status").value]
  }).then(function(x){
    if(x.status===401){s.textContent="Log in as police to save records.";return;}
    if(!x.ok){s.textContent=x.d.error||"Could not save the record.";return;}
    s.textContent="Saved. Arrest ID: "+x.d.arrest_id+(x.d.late?" (logged late, penalty triggered)":"");
    document.getElementById("f").reset();
  }).catch(function(){s.textContent="Can\u2019t reach the server. Try again.";});
});
document.querySelector(".logout").addEventListener("click",function(e){e.preventDefault();var h=this.href;fetch("/api/logout",{method:"POST"}).then(function(){window.location.href=h;},function(){window.location.href=h;});});
document.getElementById("back").addEventListener("click",function(e){
  if(history.length>1&&document.referrer){e.preventDefault();history.back();}
});
</script>
</body>
</html>
