<style>
:root{
  color-scheme:light;
  --bg:#FFFFFF; --ink:#0B1F5E; --muted:#4A5272;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100svh; background:var(--bg); color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex; flex-direction:column;
}
header{
  background:var(--ink); color:#FFFFFF; text-align:center;
  display:grid; grid-template-columns:44px 1fr 44px; align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + .6rem) .5rem .6rem;
}
h1{
  margin:0; font-family:"Bricolage Grotesque","Arial Black",Impact,sans-serif;
  font-weight:800; font-size:clamp(1.3rem,3vw,1.9rem); letter-spacing:.04em;
}
main{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1.5rem; padding:2rem 1.25rem;
}
.logo{width:112px; aspect-ratio:1; border-radius:50%; background:var(--ink); display:grid; place-items:center}
.logo img{width:80%; height:auto; display:block}
.box{width:min(100%,380px); border:2px solid var(--ink); border-radius:8px; padding:1.75rem 1.5rem}
label{display:block; margin:0 0 .4rem; font-weight:600}
input{
  width:100%; padding:.8rem .9rem; margin:0 0 1.25rem;
  border:2px solid var(--ink); border-radius:4px; background:#FFFFFF; color:var(--ink);
  font:400 1rem "Figtree",system-ui,sans-serif;
}
input:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
button{
  width:100%; padding:.9rem 1rem; border:0; border-radius:999px; cursor:pointer;
  background:var(--ink); color:#FFFFFF;
  font-family:"Bricolage Grotesque","Arial Black",Impact,sans-serif;
  font-weight:800; font-size:1.125rem; letter-spacing:.03em;
}
button:hover{filter:brightness(1.25)}
button:focus-visible{outline:3px solid var(--ink); outline-offset:4px}
.demo{margin-top:.75rem; background:#FFFFFF; color:var(--ink); border:2px solid var(--ink)}
.demo:hover{background:#EEF1FB; filter:none}
.back{display:grid; place-items:center; width:44px; height:44px; border-radius:50%; color:#FFFFFF; text-decoration:none}
.back:hover{background:rgba(255,255,255,.18)}
.back:focus-visible{outline:3px solid #FFFFFF; outline-offset:-3px}
.status{min-height:1.4em; margin:1rem 0 0; font-size:.95rem; text-align:center}
.note{margin:0 -.75rem; text-align:center; white-space:nowrap; font-size:clamp(.55rem,2.5vw,.85rem); line-height:1.4; color:#C8102E}
</style>
